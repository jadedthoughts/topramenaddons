# Builds TopRamenLauncher.exe on Windows, signs it with Azure Artifact Signing
# (so Smart App Control and SmartScreen trust it), and commits the signed
# .exe and .zip back to releases/.
#
# Needs, under Settings > Secrets and variables > Actions:
#   Secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   Variables: SIGNING_ENDPOINT        e.g. https://eus.codesigning.azure.net/
#              SIGNING_ACCOUNT         the Artifact Signing account name
#              SIGNING_PROFILE         the certificate profile name
name: Sign launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["launcher/**"]

permissions:
  contents: write   # commit the signed files back
  id-token: write   # sign in to Azure without a stored password (OIDC)

concurrency: sign-launcher

jobs:
  sign:
    # skipped until the Azure signing account is connected (see the header)
    if: vars.SIGNING_ACCOUNT != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build TopRamenLauncher.exe
        shell: bash
        run: |
          VER=$(cat launcher/VERSION)
          python tools/make_syso.py launcher/icon.ico launcher/rsrc_windows_amd64.syso
          mkdir -p out
          cd launcher
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.Version=$VER" -o ../out/TopRamenLauncher.exe .

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature out\TopRamenLauncher.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { throw "Signature is not valid: $($sig.Status)" }

      - name: Zip, update the version list, and commit
        shell: bash
        run: |
          cp out/TopRamenLauncher.exe releases/TopRamenLauncher.exe
          python -c "import zipfile; z=zipfile.ZipFile('releases/TopRamenLauncher.zip','w',zipfile.ZIP_DEFLATED); z.write('releases/TopRamenLauncher.exe','TopRamenLauncher.exe'); z.close()"
          python tools/build_release.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/TopRamenLauncher.exe releases/TopRamenLauncher.zip manifest.json
          git commit -m "Signed launcher $(cat launcher/VERSION)" || echo "nothing to commit"
          git push

  # The Mac launcher: built on a Mac, one app for Apple Silicon and Intel.
  # Ad-hoc signed (no Apple Developer ID yet), so each person approves it once
  # in System Settings > Privacy & Security > Open Anyway.
  mac:
    needs: sign
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build Top Ramen Launcher.app
        run: |
          git pull --rebase origin main
          VER=$(cat launcher/VERSION)
          mkdir -p out
          cd launcher
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.Version=$VER" -o ../out/TopRamenLauncher-$arch .
          done
          cd ..
          APP="out/Top Ramen Launcher.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/TopRamenLauncher" out/TopRamenLauncher-arm64 out/TopRamenLauncher-amd64
          # icon
          ICONSET=out/AppIcon.iconset; mkdir -p $ICONSET
          for s in 16 32 128 256 512; do
            sips -z $s $s launcher/icon-mac-1024.png --out $ICONSET/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d launcher/icon-mac-1024.png --out $ICONSET/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns $ICONSET -o "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Top Ramen Launcher</string>
            <key>CFBundleDisplayName</key><string>Top Ramen Launcher</string>
            <key>CFBundleIdentifier</key><string>com.crayonponyfish.topramenlauncher</string>
            <key>CFBundleExecutable</key><string>TopRamenLauncher</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VER</string>
            <key>CFBundleVersion</key><string>$VER</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHumanReadableCopyright</key><string>Crayon Ponyfish</string>
          </dict></plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/TopRamenLauncher"
          ditto -c -k --sequesterRsrc --keepParent "$APP" releases/TopRamenLauncher-mac.zip
          echo "$VER" > releases/TopRamenLauncher-mac.version
          ls -la releases/TopRamenLauncher-mac.zip

      - name: Update the version list and commit
        run: |
          python3 tools/build_release.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/TopRamenLauncher-mac.zip releases/TopRamenLauncher-mac.version manifest.json
          git commit -m "Mac launcher $(cat launcher/VERSION)" || echo "nothing to commit"
          git pull --rebase origin main
          git push
